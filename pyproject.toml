[project]
name = "alterra"
version = "0.1.0"
description = "A modular personal AI assistant platform"
readme = "README.md"
authors = [
    { name = "Duve3", email = "Duv3tabest@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "httpx>=0.28.1",
    "mcp[cli]>=2.2.0",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "structlog>=26.1.0",
    "tzdata>=2026.4",
]

[project.scripts]
alterra = "alterra.main:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.0.0",
    "ruff>=0.16.8",
]
voice = [
    "faster-whisper>=1.0.0",
    "piper-tts>=1.2.0",
    "onnxruntime>=1.16.0",
    "silero-vad>=5.0.0",
    "openwakeword>=0.3.0",
    "pyaudio>=0.2.13",
    "webrtcvad>=2.0.10",
]

[tool.pyright]
venvPath = "."
venv = ".venv"
exclude = [".venv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["alterra"]

[tool.coverage.report]
fail_under = 100
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py314"
